spring.application.name=grimorio-verde

server.port=8080

# Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:grimorioverde
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Paginação padrão
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# Console do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuração do Swagger (grupos v1 e v2 definidos em OpenApiConfig)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls-primary-name=v1
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Evita expor detalhes internos de erros
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---- Parte 2 ----
# CORS: origens permitidas (separe por vírgula)
grimorio.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:4200

# Rate limiting por IP: máximo de requisições por janela
grimorio.rate-limit.requests=60
grimorio.rate-limit.window-seconds=60

# Chaves de DESENVOLVIMENTO criadas ao iniciar (troque em qualquer ambiente real!)
# ADMIN: tudo, inclusive gerar/listar/revogar chaves. USUARIO: cadastrar, alterar e remover dados.
grimorio.security.admin-api-key=gv_admin_dev_chave_trocar_em_producao
grimorio.security.user-api-key=gv_usuario_dev_chave_trocar_em_producao
